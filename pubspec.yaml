name: gym_track
description: GymTrack — a production-ready workout tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^3.3.2
  hooks_riverpod: ^3.3.2
  flutter_hooks: ^0.21.3+1

  # Navigation
  go_router: ^17.3.0

  # Local storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # UI & utilities
  intl: ^0.20.3
  google_fonts: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  hive_ce_generator: ^1.11.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
